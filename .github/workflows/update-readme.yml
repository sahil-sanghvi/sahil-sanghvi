name: Sync README

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync "Now Shipping" and "Pinned" sections
        uses: actions/github-script@v7
        with:
          # A classic PAT with public_repo scope, stored as the PINNED_ITEMS_TOKEN
          # secret, is required if the default GITHUB_TOKEN can't read pinnedItems.
          github-token: ${{ secrets.PINNED_ITEMS_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;

            function replaceSection(readme, key, block) {
              const startMarker = `<!--START_SECTION:${key}-->`;
              const endMarker = `<!--END_SECTION:${key}-->`;
              const startIdx = readme.indexOf(startMarker);
              const endIdx = readme.indexOf(endMarker);
              if (startIdx === -1 || endIdx === -1) {
                core.warning(`Markers for "${key}" not found, skipping.`);
                return readme;
              }
              return (
                readme.slice(0, startIdx + startMarker.length) +
                '\n' + block + '\n' +
                readme.slice(endIdx)
              );
            }

            // --- Now Shipping: most recently pushed public repo ---
            const { data: repos } = await github.rest.repos.listForUser({
              username: owner,
              type: 'owner',
              sort: 'pushed',
              direction: 'desc',
              per_page: 20,
            });

            const latest = repos.find(
              (r) => !r.fork && !r.archived && !r.private && r.name !== owner
            );

            let latestBlock = '_Nothing to show yet._';
            if (latest) {
              const pushedDate = new Date(latest.pushed_at).toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
              });
              const description = latest.description || 'No description provided.';
              const language = latest.language ? ` \`${latest.language}\`` : '';
              latestBlock = [
                `**[${latest.name}](${latest.html_url})**${language}`,
                '',
                description,
                '',
                `_Last pushed: ${pushedDate}_`,
              ].join('\n');
            }

            // --- Pinned: repos pinned on the profile, via GraphQL ---
            let pinnedBlock = '_No pinned repositories found._';
            try {
              const result = await github.graphql(
                `query($login: String!) {
                  user(login: $login) {
                    pinnedItems(first: 6, types: [REPOSITORY]) {
                      nodes {
                        ... on Repository {
                          name
                          description
                          url
                          primaryLanguage { name }
                        }
                      }
                    }
                  }
                }`,
                { login: owner }
              );

              const nodes = result.user?.pinnedItems?.nodes || [];
              if (nodes.length > 0) {
                const rows = nodes.map((repo) => {
                  const description = repo.description || '—';
                  const language = repo.primaryLanguage?.name || '—';
                  return `| [${repo.name}](${repo.url}) | ${description} | ${language} |`;
                });
                pinnedBlock = [
                  '| Project | Description | Language |',
                  '| --- | --- | --- |',
                  ...rows,
                ].join('\n');
              }
            } catch (error) {
              core.warning(`Could not fetch pinned items: ${error.message}`);
            }

            const readmePath = 'README.md';
            let readme = fs.readFileSync(readmePath, 'utf8');
            readme = replaceSection(readme, 'latest-build', latestBlock);
            readme = replaceSection(readme, 'pinned', pinnedBlock);
            fs.writeFileSync(readmePath, readme);

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "docs: sync now-shipping and pinned sections"
          git push
